services:

  # Certificados TLS compartidos por los nodos CockroachDB de este entorno.
  # La clave de la CA permanece en un volumen separado y no se monta en los nodos.
  cockroach-cert-init:
    image: cockroachdb/cockroach:v26.2.0
    container_name: scli-cockroach-cert-init
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /certs/ca.crt ]; then
          cockroach cert create-ca --certs-dir=/certs --ca-key=/ca/ca.key
        fi
        if [ ! -s /certs/node.crt ] || [ ! -s /certs/node.key ]; then
          cockroach cert create-node \
            localhost 127.0.0.1 \
            cockroach-auth cockroach-usuarios cockroach-academico \
            crdb-e3-1 crdb-e3-2 crdb-e3-3 \
            --certs-dir=/certs --ca-key=/ca/ca.key
        fi
        if [ ! -s /certs/client.root.crt ] || [ ! -s /certs/client.root.key ]; then
          cockroach cert create-client root --certs-dir=/certs --ca-key=/ca/ca.key
        fi
        chmod 0644 /certs/ca.crt /certs/node.crt /certs/client.root.crt
        chmod 0600 /certs/node.key /certs/client.root.key /ca/ca.key
    volumes:
      - cockroach-certs:/certs
      - cockroach-ca-private:/ca
    restart: "no"

  # =========================================================
  # BASE DE DATOS DEL AUTH SERVICE
  # =========================================================
  cockroach-auth:
    image: cockroachdb/cockroach:v26.2.0
    container_name: scli-cockroach-auth

    command:
      - start-single-node
      - --certs-dir=/cockroach/cockroach-certs
      - --store=/cockroach/cockroach-data

    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully

    ports:
      - "26257:26257"
      - "8088:8080"

    volumes:
      - cockroach-auth-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro

    healthcheck:
      test:
        [
          "CMD",
          "cockroach",
          "sql",
          "--certs-dir=/cockroach/cockroach-certs",
          "--host=localhost:26257",
          "--execute=SELECT 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

    networks:
      - scli-network


  # Crea la base del Auth Service
  cockroach-auth-init:
    image: cockroachdb/cockroach:v26.2.0
    container_name: scli-cockroach-auth-init

    depends_on:
      cockroach-auth:
        condition: service_healthy

    environment:
      DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}

    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${DB_USERNAME}" in ''|*[!a-z0-9_]*) echo "AUTH_DB_USERNAME invalido" >&2; exit 1;; esac
        case "$${DB_PASSWORD}" in ''|*[!0-9a-f]*) echo "AUTH_DB_PASSWORD debe ser hexadecimal" >&2; exit 1;; esac
        [ "$${#DB_PASSWORD}" -ge 48 ] || { echo "AUTH_DB_PASSWORD demasiado corto" >&2; exit 1; }
        cockroach sql \
          --certs-dir=/cockroach/cockroach-certs \
          --host=cockroach-auth:26257 \
          --execute="CREATE DATABASE IF NOT EXISTS auth_db; CREATE USER IF NOT EXISTS \"$${DB_USERNAME}\"; ALTER USER \"$${DB_USERNAME}\" WITH PASSWORD '$${DB_PASSWORD}'; GRANT ALL ON DATABASE auth_db TO \"$${DB_USERNAME}\";"

    restart: "no"

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

    networks:
      - scli-network


  # =========================================================
  # MICROSERVICIO DE AUTH
  # =========================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    container_name: scli-auth-service

    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://cockroach-auth:26257/auth_db?sslmode=verify-full&sslrootcert=/cockroach/cockroach-certs/ca.crt&options=-c%20allow_unsafe_internals%3Dtrue
      DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USUARIOS_SERVICE_URL: http://usuarios-service:8082
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_DATA_ENABLED: ${INITIAL_DATA_ENABLED:-false}
      INITIAL_USERS_PASSWORD: ${INITIAL_USERS_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@scli.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:3000/restablecer-contrasena}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-20}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

    depends_on:
      cockroach-auth:
        condition: service_healthy
      cockroach-auth-init:
        condition: service_completed_successfully
      usuarios-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

    networks:
      - scli-network


  # =========================================================
  # BASE DE DATOS DEL USUARIOS SERVICE
  # =========================================================
  cockroach-usuarios:
    image: cockroachdb/cockroach:v24.3.5
    container_name: scli-cockroach-usuarios

    command:
      - start-single-node
      - --certs-dir=/cockroach/cockroach-certs
      - --store=/cockroach/cockroach-data

    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully

    ports:
      - "26258:26257"
      - "8089:8080"

    volumes:
      - cockroach-usuarios-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro

    healthcheck:
      test:
        [
          "CMD",
          "cockroach",
          "sql",
          "--certs-dir=/cockroach/cockroach-certs",
          "--host=localhost:26257",
          "--execute=SELECT 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

    networks:
      - scli-network


  # Crea la base del Usuarios Service
  cockroach-usuarios-init:
    image: cockroachdb/cockroach:v24.3.5
    container_name: scli-cockroach-usuarios-init

    depends_on:
      cockroach-usuarios:
        condition: service_healthy

    environment:
      DB_USERNAME: ${USUARIOS_DB_USERNAME:?USUARIOS_DB_USERNAME is required}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:?USUARIOS_DB_PASSWORD is required}

    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${DB_USERNAME}" in ''|*[!a-z0-9_]*) echo "USUARIOS_DB_USERNAME invalido" >&2; exit 1;; esac
        case "$${DB_PASSWORD}" in ''|*[!0-9a-f]*) echo "USUARIOS_DB_PASSWORD debe ser hexadecimal" >&2; exit 1;; esac
        [ "$${#DB_PASSWORD}" -ge 48 ] || { echo "USUARIOS_DB_PASSWORD demasiado corto" >&2; exit 1; }
        cockroach sql \
          --certs-dir=/cockroach/cockroach-certs \
          --host=cockroach-usuarios:26257 \
          --execute="CREATE DATABASE IF NOT EXISTS usuarios_db; CREATE USER IF NOT EXISTS \"$${DB_USERNAME}\"; ALTER USER \"$${DB_USERNAME}\" WITH PASSWORD '$${DB_PASSWORD}'; GRANT ALL ON DATABASE usuarios_db TO \"$${DB_USERNAME}\";"

    restart: "no"

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

    networks:
      - scli-network


  # =========================================================
  # MICROSERVICIO DE USUARIOS
  # =========================================================
  usuarios-service:
    build:
      context: ./services/usuarios-service
      dockerfile: Dockerfile

    container_name: scli-usuarios-service

    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://cockroach-usuarios:26257/usuarios_db?sslmode=verify-full&sslrootcert=/cockroach/cockroach-certs/ca.crt
      DB_USERNAME: ${USUARIOS_DB_USERNAME:?USUARIOS_DB_USERNAME is required}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:?USUARIOS_DB_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_HASH_KEY: ${DATA_HASH_KEY}
      INITIAL_DATA_ENABLED: ${INITIAL_DATA_ENABLED:-false}
      INITIAL_PISO_IDS: ${INITIAL_PISO_IDS:-35000000-0000-0000-0000-000000000001,35000000-0000-0000-0000-000000000002,35000000-0000-0000-0000-000000000003,35000000-0000-0000-0000-000000000004}
      INITIAL_CARRERA_IDS: ${INITIAL_CARRERA_IDS:-37000000-0000-0000-0000-000000000001,55584c85-0359-3f3f-8fa1-55000611374b}
      INITIAL_PERIODO_ID: ${INITIAL_PERIODO_ID:-3f000000-0000-0000-0000-000000000001}
      OTEL_SERVICE_NAME: usuarios-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

    depends_on:
      cockroach-usuarios:
        condition: service_healthy
      cockroach-usuarios-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

    networks:
      - scli-network


  # =========================================================
  # BASE DE DATOS DEL ACADEMICO-LABORATORIOS SERVICE
  # =========================================================
  cockroach-academico:
    image: cockroachdb/cockroach:v26.2.0
    container_name: scli-cockroach-academico

    command:
      - start-single-node
      - --certs-dir=/cockroach/cockroach-certs
      - --store=/cockroach/cockroach-data

    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully

    ports:
      - "26259:26257"
      - "8090:8080"

    volumes:
      - cockroach-academico-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro

    healthcheck:
      test:
        [
          "CMD",
          "cockroach",
          "sql",
          "--certs-dir=/cockroach/cockroach-certs",
          "--host=localhost:26257",
          "--execute=SELECT 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

    networks:
      - scli-network


  # Crea la base del Academico-Laboratorios Service
  cockroach-academico-init:
    image: cockroachdb/cockroach:v26.2.0
    container_name: scli-cockroach-academico-init

    depends_on:
      cockroach-academico:
        condition: service_healthy

    environment:
      DB_USERNAME: ${ACADEMICO_DB_USERNAME:?ACADEMICO_DB_USERNAME is required}
      DB_PASSWORD: ${ACADEMICO_DB_PASSWORD:?ACADEMICO_DB_PASSWORD is required}

    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${DB_USERNAME}" in ''|*[!a-z0-9_]*) echo "ACADEMICO_DB_USERNAME invalido" >&2; exit 1;; esac
        case "$${DB_PASSWORD}" in ''|*[!0-9a-f]*) echo "ACADEMICO_DB_PASSWORD debe ser hexadecimal" >&2; exit 1;; esac
        [ "$${#DB_PASSWORD}" -ge 48 ] || { echo "ACADEMICO_DB_PASSWORD demasiado corto" >&2; exit 1; }
        cockroach sql \
          --certs-dir=/cockroach/cockroach-certs \
          --host=cockroach-academico:26257 \
          --execute="CREATE DATABASE IF NOT EXISTS academico_db; CREATE USER IF NOT EXISTS \"$${DB_USERNAME}\"; ALTER USER \"$${DB_USERNAME}\" WITH PASSWORD '$${DB_PASSWORD}'; GRANT ALL ON DATABASE academico_db TO \"$${DB_USERNAME}\";"

    restart: "no"

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

    networks:
      - scli-network


  # =========================================================
  # ACADEMICO-LABORATORIOS SERVICE
  # =========================================================
  academico-laboratorios-service:
    build:
      context: ./services/academico-laboratorios-service
      dockerfile: Dockerfile

    container_name: scli-academico-laboratorios-service

    depends_on:
      cockroach-academico:
        condition: service_healthy
      cockroach-academico-init:
        condition: service_completed_successfully

    environment:
      DB_URL: jdbc:postgresql://cockroach-academico:26257/academico_db?sslmode=verify-full&sslrootcert=/cockroach/cockroach-certs/ca.crt&options=-c%20allow_unsafe_internals%3Dtrue
      DB_USERNAME: ${ACADEMICO_DB_USERNAME:?ACADEMICO_DB_USERNAME is required}
      DB_PASSWORD: ${ACADEMICO_DB_PASSWORD:?ACADEMICO_DB_PASSWORD is required}
      SERVER_PORT: 8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      USUARIOS_SERVICE_URL: http://usuarios-service:8082
      INITIAL_DATA_ENABLED: ${INITIAL_DATA_ENABLED:-false}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      OTEL_SERVICE_NAME: academico-laboratorios-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    networks:
      - scli-network

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro


  # =========================================================
  # INICIO - RESERVAS-SOLICITUDES SERVICE (Freddy Farinango)
  # =========================================================

  # =========================================================
  # RESERVAS-SOLICITUDES SERVICE
  # =========================================================
  reservas-solicitudes-service:
    build:
      context: ./services/reservas-solicitudes-service
      dockerfile: Dockerfile

    container_name: reservas-service

    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://crdb-e3-1:26257,crdb-e3-2:26257,crdb-e3-3:26257/reservas_db?sslmode=verify-full&sslrootcert=/cockroach/cockroach-certs/ca.crt&options=-c%20allow_unsafe_internals%3Dtrue
      DB_USERNAME: ${RESERVAS_DB_USERNAME:?RESERVAS_DB_USERNAME is required}
      DB_PASSWORD: ${RESERVAS_DB_PASSWORD:?RESERVAS_DB_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      USUARIOS_SERVICE_URL: http://usuarios-service:8082
      ACADEMICO_LABORATORIOS_SERVICE_URL: http://academico-laboratorios-service:8083
      RESERVA_EXPIRATION_GRACE_MINUTES: ${RESERVA_EXPIRATION_GRACE_MINUTES:-1440}
      ASISTENCIA_WINDOW_MINUTES: ${ASISTENCIA_WINDOW_MINUTES:-15}
      OTEL_SERVICE_NAME: reservas-solicitudes-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

    depends_on:
      crdb-e3-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped

    networks:
      - scli-network

    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro

  # =========================================================
  # API GATEWAY
  # =========================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USUARIOS_SERVICE_URL: http://usuarios-service:8082
      ACADEMICO_SERVICE_URL: http://academico-laboratorios-service:8083
      RESERVAS_SOLICITUDES_SERVICE_URL: http://reservas-solicitudes-service:8084
      JWT_SECRET: ${JWT_SECRET}
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

    depends_on:
      auth-service:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
      academico-laboratorios-service:
        condition: service_healthy
      reservas-solicitudes-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped

    networks:
      - scli-network

  # =========================================================
  # APLICACION WEB
  # =========================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      api-gateway:
        condition: service_healthy

    networks:
      - scli-network

  # =========================================================
  # FIN - RESERVAS-SOLICITUDES SERVICE (Freddy Farinango)
  # =========================================================

  # =========================================================
  # COCKROACHDB CLUSTER E3 (Paso 1 - Isaías Urbina)
  # =========================================================
  crdb-e3-1:
    image: ${CRDB_E3_IMAGE:-cockroachdb/cockroach:v26.2.0}
    container_name: reservas-db-node-1
    command:
      - start
      - --certs-dir=/cockroach/cockroach-certs
      - --advertise-addr=crdb-e3-1
      - --join=crdb-e3-1,crdb-e3-2,crdb-e3-3
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "${CRDB_E3_1_SQL_PORT:-26261}:26257"
      - "${CRDB_E3_1_HTTP_PORT:-8092}:8080"
    volumes:
      - crdb-e3-1-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro
    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--certs-dir=/cockroach/cockroach-certs", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - scli-network

  crdb-e3-2:
    image: ${CRDB_E3_IMAGE:-cockroachdb/cockroach:v26.2.0}
    container_name: reservas-db-node-2
    command:
      - start
      - --certs-dir=/cockroach/cockroach-certs
      - --advertise-addr=crdb-e3-2
      - --join=crdb-e3-1,crdb-e3-2,crdb-e3-3
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "${CRDB_E3_2_SQL_PORT:-26262}:26257"
      - "${CRDB_E3_2_HTTP_PORT:-8093}:8080"
    volumes:
      - crdb-e3-2-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro
    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--certs-dir=/cockroach/cockroach-certs", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - scli-network

  crdb-e3-3:
    image: ${CRDB_E3_IMAGE:-cockroachdb/cockroach:v26.2.0}
    container_name: reservas-db-node-3
    command:
      - start
      - --certs-dir=/cockroach/cockroach-certs
      - --advertise-addr=crdb-e3-3
      - --join=crdb-e3-1,crdb-e3-2,crdb-e3-3
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "${CRDB_E3_3_SQL_PORT:-26263}:26257"
      - "${CRDB_E3_3_HTTP_PORT:-8094}:8080"
    volumes:
      - crdb-e3-3-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/cockroach-certs:ro
    depends_on:
      cockroach-cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--certs-dir=/cockroach/cockroach-certs", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - scli-network

  crdb-e3-init:
    image: ${CRDB_E3_IMAGE:-cockroachdb/cockroach:v26.2.0}
    container_name: reservas-db-init
    depends_on:
      crdb-e3-1:
        condition: service_started
      crdb-e3-2:
        condition: service_started
      crdb-e3-3:
        condition: service_started
    environment:
      DB_USERNAME: ${RESERVAS_DB_USERNAME:?RESERVAS_DB_USERNAME is required}
      DB_PASSWORD: ${RESERVAS_DB_PASSWORD:?RESERVAS_DB_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${DB_USERNAME}" in ''|*[!a-z0-9_]*) echo "RESERVAS_DB_USERNAME invalido" >&2; exit 1;; esac
        case "$${DB_PASSWORD}" in ''|*[!0-9a-f]*) echo "RESERVAS_DB_PASSWORD debe ser hexadecimal" >&2; exit 1;; esac
        [ "$${#DB_PASSWORD}" -ge 48 ] || { echo "RESERVAS_DB_PASSWORD demasiado corto" >&2; exit 1; }
        until cockroach init \
          --certs-dir=/cockroach/cockroach-certs \
          --host=crdb-e3-1:26257
        do
          if cockroach sql \
            --certs-dir=/cockroach/cockroach-certs \
            --host=crdb-e3-1:26257 \
            --execute="SELECT 1"
          then
            break
          fi
          sleep 2
        done

        until cockroach sql \
          --certs-dir=/cockroach/cockroach-certs \
          --host=crdb-e3-1:26257 \
          --execute="SELECT 1"
        do
          sleep 2
        done

        cockroach sql \
          --certs-dir=/cockroach/cockroach-certs \
          --host=crdb-e3-1:26257 \
          --execute="CREATE DATABASE IF NOT EXISTS reservas_db; CREATE USER IF NOT EXISTS \"$${DB_USERNAME}\"; ALTER USER \"$${DB_USERNAME}\" WITH PASSWORD '$${DB_PASSWORD}'; GRANT ALL ON DATABASE reservas_db TO \"$${DB_USERNAME}\"; ALTER RANGE default CONFIGURE ZONE USING num_replicas = 3"
    volumes:
      - cockroach-certs:/cockroach/cockroach-certs:ro
    restart: "no"
    networks:
      - scli-network


  # =========================================================
  # OBSERVABILIDAD - CADVISOR (Isaías Urbina)
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: scli-cadvisor

    ports:
      - "8085:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    restart: unless-stopped

    networks:
      - scli-network


  # =========================================================
  # OBSERVABILIDAD - PROMETHEUS + GRAFANA + OTEL COLLECTOR (Isaías Urbina)
  # =========================================================
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: scli-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - cockroach-certs:/cockroach/cockroach-certs:ro

    restart: unless-stopped

    networks:
      - scli-network


  grafana:
    image: grafana/grafana:11.3.0
    container_name: scli-grafana

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/grafana/pfc-dashboard.json:/var/lib/grafana/canonical/pfc-dashboard.json:ro
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus
      - tempo

    restart: unless-stopped

    networks:
      - scli-network


  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    container_name: scli-otel-collector

    command: ["--config=/etc/otelcol/config.yaml"]

    ports:
      - "4317:4317"
      - "4318:4318"

    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

    depends_on:
      - loki
      - tempo

    restart: unless-stopped

    networks:
      - scli-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: scli-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./ops/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - scli-network


  # =========================================================
  # OBSERVABILIDAD - LOKI (auditoria/SIEM, Isaías Urbina)
  # =========================================================
  loki:
    image: grafana/loki:3.3.0
    container_name: scli-loki

    ports:
      - "3100:3100"

    volumes:
      - loki-data:/loki

    restart: unless-stopped

    networks:
      - scli-network


volumes:

  cockroach-certs:

  cockroach-ca-private:

  cockroach-auth-data:

  cockroach-usuarios-data:

  cockroach-academico-data:

  crdb-e3-1-data:

  crdb-e3-2-data:

  crdb-e3-3-data:

  loki-data:

  tempo-data:


networks:

  scli-network:
    driver: bridge
