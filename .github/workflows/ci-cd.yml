name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  lint:
    name: Lint - backend and web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/academico-laboratorios-service/pom.xml

      - name: Checkstyle - academico-laboratorios-service
        working-directory: services/academico-laboratorios-service
        run: mvn --batch-mode checkstyle:check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint - apps/web
        working-directory: apps/web
        run: npm run lint

  test-arbiter-experiment:
    name: Test - ARBITER experimental harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install experimental Python dependencies
        run: python -m pip install -r spark/requirements.txt

      - name: Compile experimental scripts
        run: python -m py_compile experimentos/*.py experimentos/tests/test_arbiter.py

      - name: Run experimental unit tests
        run: python -m unittest discover -s experimentos/tests -p "test_*.py" -v

  verify-experimental-manifest:
    name: Verify - all tracked evidence manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test manifest verifier
        run: python -m unittest discover -s scripts/tests -p "test_verificar_manifiestos.py" -v

      - name: Verify all tracked checksums
        run: python scripts/verificar-manifiestos.py

      - name: Audit real ARBITER HTTP census, latencies and manuscript
        run: >-
          python experimentos/auditar_http_arbiter.py
          experimentos/resultados/arbiter/campaign/raw --all-scenarios
          --check-summary experimentos/resultados/arbiter/campaign/summary/runs.json
          --check-manuscript docs/secciones/04-observabilidad-iso.tex

      - name: Reconcile real ISO evidence and test negative ARBITER audit
        run: >-
          python -m unittest experimentos.tests.test_evidencia_real
          experimentos.tests.test_auditar_http_arbiter -v

      - name: Analyze versioned ISO campaigns offline
        run: |
          python experimentos/analizar_iso25010.py experimentos/resultados/iso25010.csv
          python experimentos/analizar_iso25010.py experimentos/resultados/iso25010-correctiva.csv
          python experimentos/analizar_iso25010.py experimentos/resultados/iso25010-correctiva-poblada.csv
          python experimentos/analizar_iso25010.py experimentos/resultados/iso25010-eficiencia-poblada.csv

      - name: Ensure offline analysis leaves tracked evidence unchanged
        run: git diff --exit-code

  validate-openapi-contracts:
    name: Validate - OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate service and gateway contracts
        run: python scripts/validar-contratos-openapi.py

  test-backend:
    name: Build and test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/auth-service
            database: auth_db
          - service: services/usuarios-service
            database: usuarios_db
          - service: services/academico-laboratorios-service
            database: academico_db
          - service: services/reservas-solicitudes-service
            database: reservas_db
          - service: services/api-gateway
            database: gateway_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Start CockroachDB for tests
        shell: bash
        run: |
          set -Eeuo pipefail
          certs_dir="$RUNNER_TEMP/cockroach-certs"
          ca_dir="$RUNNER_TEMP/cockroach-ca"
          mkdir -p "$certs_dir" "$ca_dir"

          for attempt in {1..4}; do
            if docker pull cockroachdb/cockroach:v26.2.0; then
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$certs_dir:/certs" \
            --volume "$ca_dir:/ca" \
            cockroachdb/cockroach:v26.2.0 \
            cert create-ca --certs-dir=/certs --ca-key=/ca/ca.key

          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$certs_dir:/certs" \
            --volume "$ca_dir:/ca" \
            cockroachdb/cockroach:v26.2.0 \
            cert create-node localhost 127.0.0.1 ci-cockroach \
            --certs-dir=/certs --ca-key=/ca/ca.key

          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$certs_dir:/certs" \
            --volume "$ca_dir:/ca" \
            cockroachdb/cockroach:v26.2.0 \
            cert create-client root --certs-dir=/certs --ca-key=/ca/ca.key

          docker run --name ci-cockroach --detach \
            --publish 26257:26257 \
            --volume "$certs_dir:/cockroach/certs:ro" \
            cockroachdb/cockroach:v26.2.0 \
            start-single-node --certs-dir=/cockroach/certs

          for attempt in {1..30}; do
            if docker exec ci-cockroach cockroach sql \
              --certs-dir=/cockroach/certs \
              --host=localhost:26257 \
              --execute="SELECT 1"; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs ci-cockroach
              exit 1
            fi

            sleep 2
          done

          db_username="ci_app"
          db_password="$(openssl rand -hex 32)"
          docker exec ci-cockroach cockroach sql \
            --certs-dir=/cockroach/certs \
            --host=localhost:26257 \
            --execute="CREATE DATABASE IF NOT EXISTS ${{ matrix.database }}; CREATE USER IF NOT EXISTS $db_username; ALTER USER $db_username WITH PASSWORD '$db_password'; GRANT ALL ON DATABASE ${{ matrix.database }} TO $db_username;"

          {
            echo "DB_URL=jdbc:postgresql://localhost:26257/${{ matrix.database }}?sslmode=verify-full&sslrootcert=$certs_dir/ca.crt&options=-c%20allow_unsafe_internals%3Dtrue"
            echo "DB_USERNAME=$db_username"
            echo "DB_PASSWORD=$db_password"
          } >> "$GITHUB_ENV"

      - name: Prepare test environment
        shell: bash
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "DATA_HASH_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - name: Generate consumer Pacts
        if: >-
          ${{ matrix.service == 'services/reservas-solicitudes-service' ||
          matrix.service == 'services/usuarios-service' ||
          matrix.service == 'services/academico-laboratorios-service' }}
        run: >-
          mvn --batch-mode
          -f tests/contract/pom.xml
          -Dpact.rootDir="$GITHUB_WORKSPACE/tests/contract/target/pacts"
          test

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode verify

      - name: Upload Pact contracts
        if: ${{ matrix.service == 'services/reservas-solicitudes-service' }}
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts-${{ github.sha }}
          path: tests/contract/target/pacts/*.json

  crdb-tests:
    name: CockroachDB E3 cluster tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-web, test-mobile, test-mobile-instrumented]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CockroachDB test environment
        shell: bash
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "DATA_HASH_KEY=$(openssl rand -base64 32)"
            echo "AUTH_DB_USERNAME=ci_auth_app"
            echo "AUTH_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "USUARIOS_DB_USERNAME=ci_usuarios_app"
            echo "USUARIOS_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "ACADEMICO_DB_USERNAME=ci_academico_app"
            echo "ACADEMICO_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "RESERVAS_DB_USERNAME=ci_reservas_app"
            echo "RESERVAS_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Validate CockroachDB E3 cluster
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in {1..4}; do
            if docker pull cockroachdb/cockroach:v26.2.0; then
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

          bash scripts/ci/verify-crdb-e3.sh

      - name: Cleanup CockroachDB E3 stack
        if: always()
        run: |
          docker compose logs crdb-e3-1 crdb-e3-2 crdb-e3-3 crdb-e3-init reservas-solicitudes-service || true
          docker compose down -v || true

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests
        working-directory: apps/web
        run: npm run test:coverage

      - name: Upload web coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-summary-${{ github.sha }}
          path: apps/web/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Package web distribution
        working-directory: apps/web
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist.tar.gz

  test-mobile:
    name: Test mobile
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run mobile unit tests and coverage
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport

      - name: Run Android lint
        working-directory: apps/mobile
        run: ./gradlew lint

      - name: Upload mobile coverage report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-${{ github.sha }}
          path: apps/mobile/app/build/reports/jacoco/jacocoTestReport/

  test-mobile-instrumented:
    name: Test mobile instrumented
    runs-on: ubuntu-latest
    needs: test-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd apps/mobile && chmod +x gradlew && ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-instrumented-results-${{ github.sha }}
          path: apps/mobile/app/build/reports/androidTests/connected/
          if-no-files-found: warn

  build-mobile-apk:
    name: Build mobile APK
    runs-on: ubuntu-latest
    needs: [test-mobile, test-mobile-instrumented]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pfc-debug-apk-${{ github.sha }}
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk

  build-mobile-release-signed:
    name: Build - Android release signed
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Check signing configuration
        id: signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_SIGNING_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_SIGNING_KEY_ALIAS" ] || \
             [ -z "$ANDROID_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Android release signing requires all four repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        if: ${{ steps.signing.outputs.configured == 'true' }}
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Firebase configuration for release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required to build a release APK with FCM configuration."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/app/google-services.json
          if [ ! -s apps/mobile/app/google-services.json ]; then
            echo "::error::apps/mobile/app/google-services.json was not created or is empty."
            exit 1
          fi

      - name: Build unsigned release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest lint assembleRelease

      - name: Remove temporary Firebase configuration
        if: ${{ always() && steps.signing.outputs.configured == 'true' }}
        shell: bash
        run: rm -f apps/mobile/app/google-services.json

      - name: Prepare release output and keystore
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          version="1.0.1"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_APK=scli-mobile-${version}-release.apk" >> "$GITHUB_ENV"
          mkdir -p apps/mobile/app/build/outputs/release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scli-release.jks"

      - name: Align and sign release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          output_dir="apps/mobile/app/build/outputs/release"
          "$build_tools/zipalign" -p -f 4 \
            apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$output_dir/${RELEASE_APK%.apk}-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/scli-release.jks" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "$output_dir/$RELEASE_APK" \
            "$output_dir/${RELEASE_APK%.apk}-aligned.apk"

      - name: Verify signature and checksum
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          output_dir="apps/mobile/app/build/outputs/release"
          "$build_tools/apksigner" verify --verbose --print-certs \
            "$output_dir/$RELEASE_APK"
          cd "$output_dir"
          sha256sum "$RELEASE_APK" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scli-mobile-release-${{ github.sha }}
          path: |
            apps/mobile/app/build/outputs/release/${{ env.RELEASE_APK }}
            apps/mobile/app/build/outputs/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary signing material
        if: ${{ always() && steps.signing.outputs.configured == 'true' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/scli-release.jks"

  build-release-documentation:
    name: Build - release manuscript
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-bibtex-extra

      - name: Compile release manuscript
        working-directory: docs
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -f main.pdf
          cp main.pdf "SCLI-PFC-${GITHUB_REF_NAME}.pdf"

      - name: Upload release manuscript
        uses: actions/upload-artifact@v4
        with:
          name: release-manuscript-${{ github.sha }}
          path: docs/SCLI-PFC-${{ github.ref_name }}.pdf
          if-no-files-found: error

  integration:
    name: Compose integration tests
    runs-on: ubuntu-latest
    needs: crdb-tests
    env:
      VITE_API_URL: http://127.0.0.1:8080
      VITE_API_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Prepare integration environment
        shell: bash
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "DATA_HASH_KEY=$(openssl rand -base64 32)"
            echo "AUTH_DB_USERNAME=ci_auth_app"
            echo "AUTH_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "USUARIOS_DB_USERNAME=ci_usuarios_app"
            echo "USUARIOS_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "ACADEMICO_DB_USERNAME=ci_academico_app"
            echo "ACADEMICO_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "RESERVAS_DB_USERNAME=ci_reservas_app"
            echo "RESERVAS_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start stack and run integration checks
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose up -d --build

          wait_for_health() {
            local service="$1"
            local container
            local health

            for attempt in {1..60}; do
              container="$(docker compose ps -q "$service")"
              if [ -n "$container" ]; then
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
                if [ "$health" = "healthy" ]; then
                  echo "$service is healthy"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Timed out waiting for $service to become healthy"
            docker compose ps
            return 1
          }

          for service in \
            cockroach-auth auth-service \
            cockroach-usuarios usuarios-service \
            cockroach-academico academico-laboratorios-service \
            reservas-solicitudes-service api-gateway; do
            wait_for_health "$service"
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API Gateway health endpoint did not become available"
              exit 1
            fi
            sleep 2
          done

          login_status="$(curl --silent --show-error \
            --output /tmp/login-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Admin123!"}' \
            http://localhost:8080/api/v1/auth/login)"
          case "$login_status" in
            2*) ;;
            *)
              echo "LOGIN_HTTP_STATUS=$login_status"
              node -e "try { const body = JSON.parse(require('fs').readFileSync(0, 'utf8')); console.error(body.message || 'Login request failed'); } catch { console.error('Login request failed'); }" < /tmp/login-response.json
              exit 1
              ;;
          esac

          access_token="$(node -e "try { const body = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.stdout.write(body.accessToken || ''); } catch {}" < /tmp/login-response.json)"
          if [ -z "$access_token" ]; then
            echo "Login succeeded but accessToken was not present"
            exit 1
          fi

          response_status="$(curl --silent --show-error \
            --output /tmp/campus-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $access_token" \
            http://localhost:8080/api/v1/campus)"
          case "$response_status" in
            2*) ;;
            *) echo "Gateway functional request returned HTTP $response_status"; cat /tmp/campus-response.json; exit 1 ;;
          esac

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Set up Python for Locust
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/load/requirements.txt

      - name: Install Locust
        run: python -m pip install --requirement tests/load/requirements.txt

      - name: Run controlled load smoke test
        env:
          LOCUST_USERNAME: admin
          LOCUST_PASSWORD: Admin123!
        run: >-
          python -m locust
          -f tests/load/locustfile.py
          --headless
          --host http://127.0.0.1:8080
          --users 2
          --spawn-rate 1
          --run-time 10s
          --only-summary
          --exit-code-on-error 1

      - name: Cleanup integration stack
        if: always()
        run: |
          docker compose logs || true
          docker compose down -v || true

  build-images:
    name: Build and publish image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [lint, test-arbiter-experiment, test-backend, test-web, test-mobile, test-mobile-instrumented, build-mobile-apk, crdb-tests, integration]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: usuarios-service
            context: services/usuarios-service
          - name: academico-laboratorios-service
            context: services/academico-laboratorios-service
          - name: reservas-solicitudes-service
            context: services/reservas-solicitudes-service
          - name: api-gateway
            context: services/api-gateway
          - name: web
            context: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scli-${{ matrix.name }}:${{ github.sha }}

      - name: Publish and inspect version image alias
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          SERVICE: ${{ matrix.name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/scli-${SERVICE}"
          docker buildx imagetools create \
            --tag "${image}:${GITHUB_REF_NAME}" \
            "${image}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}"

  publish-release:
    name: Publish versioned GitHub Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-mobile-release-signed, build-release-documentation, build-images, verify-experimental-manifest]
    permissions:
      contents: write
    steps:
      - name: Download signed APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: scli-mobile-release-${{ github.sha }}
          path: release-assets/mobile

      - name: Download manuscript PDF
        uses: actions/download-artifact@v4
        with:
          name: release-manuscript-${{ github.sha }}
          path: release-assets/docs

      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          apks=(release-assets/mobile/*.apk)
          pdfs=(release-assets/docs/*.pdf)
          checksum="release-assets/mobile/SHA256SUMS.txt"
          if [[ ${#apks[@]} -ne 1 || ${#pdfs[@]} -ne 1 || ! -f "$checksum" ]]; then
            echo "::error::Expected exactly one signed APK, one PDF and SHA256SUMS.txt."
            exit 1
          fi
          apk="release-assets/mobile/scli-mobile-${GITHUB_REF_NAME}-release.apk"
          pdf="release-assets/docs/SCLI-PFC-${GITHUB_REF_NAME}.pdf"
          if [[ "${apks[0]}" != "$apk" || "${pdfs[0]}" != "$pdf" ]]; then
            echo "::error::Release asset names do not match the version tag."
            exit 1
          fi
          (
            cd release-assets/mobile
            sha256sum --check SHA256SUMS.txt
            sha256sum "${apk##*/}" | cmp - SHA256SUMS.txt
          )
          ls -lah "$pdf" "$apk" "$checksum"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$pdf" "$apk" "$checksum" --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              "$pdf" "$apk" "$checksum" \
              --verify-tag \
              --title "SCLI $GITHUB_REF_NAME" \
              --generate-notes \
              "${prerelease[@]}"
          fi

  call-deploy:
    name: Call production VM deployment
    needs: build-images
    if: >-
      github.event_name == 'push' &&
      (
        (github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true') ||
        (github.ref == 'refs/heads/feature/entrega-4' && vars.CD_FEATURE_ENABLED == 'true')
      )
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ github.sha }}
      deploy_ref: ${{ github.ref_name }}
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
