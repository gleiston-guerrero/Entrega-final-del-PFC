global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/freddy-reservas.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8081

  - job_name: reservas-solicitudes-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - reservas-solicitudes-service:8084
  
  - job_name: academico-laboratorios-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - academico-laboratorios-service:8083

  - job_name: usuarios-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - usuarios-service:8082

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: crdb-e3-cluster
    scheme: https
    metrics_path: /_status/vars
    tls_config:
      ca_file: /cockroach/cockroach-certs/ca.crt
    static_configs:
      - targets:
          - crdb-e3-1:8080
          - crdb-e3-2:8080
          - crdb-e3-3:8080
